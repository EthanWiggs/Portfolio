<!DOCTYPE html> <html lang="en"> <head> <meta charset="utf-8"/> <meta name="viewport" content="width=device-width, initial-scale=1"/> <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"/> <title>TPN Board Configurator — Test Mode</title> <link rel="stylesheet" href="style.css"> </head> <body> <div class="app"> <aside> <div class="brand-strip" aria-label="Niglon Protego 400"> </div> <h1>TPN Board Options — Test Mode</h1> <p class="helper">Upload Photos to test how they fit in the visualiser.</p> <div class="capacity-block"> <div class="capacity-label">Board capacity</div> <div class="space-bar" id="capacity-bar"> <div class="space-bar-fill"></div> <div class="space-bar-text"></div> </div> </div> <section class="section"> <div class="capacity-label">Add a test photo</div> <form id="swatch-form" class="swatch-form" novalidate> <div class="field-row"> <label class="field-label" for="swatch-name">Label</label> <input class="field-input" type="text" id="swatch-name" placeholder="e.g. 100A 4P Switch" maxlength="60"/> </div> <div class="field-row"> <label class="field-label" for="swatch-modules">Modules wide</label> <input class="field-input field-input-number" type="number" id="swatch-modules" min="1" max="16" value="1"/> </div> <div class="field-row"> <label class="field-label" for="swatch-image">Photo</label> <input class="field-input" type="file" id="swatch-image" accept="image/*"/> </div> <p class="config-message" id="swatch-form-message"></p> <button class="btn-add" type="submit">Add to board</button> </form> </section> <section class="section"> <div class="capacity-label">Test photos</div> <div class="swatch-grid" id="swatch-grid"></div> </section> <div class="controls"> <button class="btn" id="reset">Reset</button> </div> </aside> <main> <div class="stage-wrap"> <section class="stage-card" aria-labelledby="board-layout-title"> <div class="stage-card-header"> <p class="stage-eyebrow">Live Output</p> <h2 id="board-layout-title">Board Layout</h2> <p class="stage-copy">Click an empty module to add a photo. Hover a filled module to recolour, replace, or remove it.</p> </div> <div class="board-grid-wrap"> <div class="board-grid" id="board-grid"></div> </div> </section> </div> </main> </div> <script src="js/app.js"></script> </body> </html>
